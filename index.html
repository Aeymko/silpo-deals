<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ff7a00">
    <meta
      name="description"
      content="Акції Сільпо, відсортовані від найбільшої знижки у відсотках, з наявністю у вашому магазині."
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff7a00' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z'/%3E%3Cpath d='m9 15 6-6'/%3E%3Ccircle cx='9.5' cy='9.5' r='.5'/%3E%3Ccircle cx='14.5' cy='14.5' r='.5'/%3E%3C/svg%3E"
    >
    <title>Знижки Сільпо — від найбільшої знижки</title>
    <script>
    // Apply the stored theme before first paint to avoid a flash.
    const mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
    if (mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
